[workspace]
members = [
    "vanguard-core",
    "vanguard-xdp",
    "vanguard-skmsg",
    "vanguard-skb",
    "vanguard-daemon",
    "vanguard-cli",
    "vanguard-grpc",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aya-ebpf = { git = "https://github.com/aya-rs/aya" }
aya-log-ebpf = { git = "https://github.com/aya-rs/aya" }
aya = { git = "https://github.com/aya-rs/aya" }
aya-log = { git = "https://github.com/aya-rs/aya" }
brevno = { git = "https://github.com/aeterna-ars/brevno" }
erret-macro = { git = "https://github.com/aeterna-ars/erret" }
erret-result = { git = "https://github.com/aeterna-ars/erret" }
env_logger = "0.11.11"
tokio = { version = "1.53.1", features = ["full"] }
serde = "1.0.228"
serde_yaml = "0.9.34"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6" }
prost = "0.14.4"
clap = { version = "4.6.1", features = ["derive"] }
libsystemd = "0.7.2"
network-types = { version = "0.2.0", default-features = false }