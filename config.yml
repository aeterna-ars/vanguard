general:
  iface: "eth0"

  maps:
    path: /sys/fs/bpf/vanguard
    pin: false

  grpc:
    up: true
    addr: "0.0.0.0:8080"

  blacklist:
  - ip: "1.2.3.4"
    blocked_until: 1234567890
  - ip: "5.6.7.8"

  whitelist:
  - "192.168.1.1"
  - "10.0.0.0/24"
  - "::1"

xdp:
  config:
    rate_limit: 1000
    burst_limit: 1000
    base_block_time: 1000
    max_block_time: 1000
    rep_cooldown_time: 1000

  rules:
    - key:
        ip: "5.6.7.8"
        port: 80
        eth: "ipv4"
        proto: "tcp"
      value:
        action: "drop"

    - key:
        ip: "2001:db8::1"
        port: 443
        eth: "ipv6"
        proto: "tcp"
      value:
        action: "pass"

    - key:
        ip: "0.0.0.0"
        port: 53
        eth: "ipv4"
        proto: "udp"
      value:
        action: "redirect"
        to:
          ip: "1.1.1.1"
          port: 53
          eth: "ipv4"
          proto: "udp"

sk:
  config:

  rules:
    - key:

      value:
      
msg:
  config:

  rules:
    - key:

      value: